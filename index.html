<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CIBUM Group | Web en progreso</title>
  <meta name="description" content="Estamos trabajando en la web de CIBUM Group.">
  <link rel="icon" href="images/icono-1-150x150.png" type="image/png">
  <style>
    :root {
      --black: #0d0d0d;
      --panel: #151515;
      --gold: #c49a3d;
      --text: #f7f2e8;
      --muted: rgba(247, 242, 232, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow: hidden;
    }

    .maintenance {
      width: min(640px, 100%);
      text-align: center;
      padding: 48px 28px;
      border: 1px solid rgba(196, 154, 61, 0.28);
      background: linear-gradient(180deg, rgba(21, 21, 21, 0.96), rgba(13, 13, 13, 0.96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .maintenance__logo {
      width: min(210px, 70vw);
      height: auto;
      margin-bottom: 38px;
    }

    .maintenance__eyebrow {
      margin: 0 0 14px;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .maintenance__title {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 4.2rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: 0;
    }

    .maintenance__text {
      max-width: 440px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .maintenance__line {
      width: 76px;
      height: 2px;
      margin: 30px auto 0;
      background: var(--gold);
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      .maintenance {
        padding: 40px 22px;
      }

      .maintenance__text {
        font-size: 0.98rem;
      }
    }
  </style>
</head>
<body>
  <main class="maintenance" aria-label="Web en progreso">
    <img class="maintenance__logo" src="images/cibum-logo-1.png" alt="CIBUM Group">
    <p class="maintenance__eyebrow">Web en progreso</p>
    <h1 class="maintenance__title">Estamos trabajando en la web</h1>
    <p class="maintenance__text">Muy pronto volveremos con toda la informacion actualizada. Gracias por tu paciencia.</p>
    <div class="maintenance__line" aria-hidden="true"></div>
  </main>
</body>
</html>
